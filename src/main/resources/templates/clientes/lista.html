<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Clientes</h2>

        <a th:if="${perfilAtual == 'ATENDENTE'}"
           th:href="@{/clientes/novo}"
           class="btn btn-primary">
            Novo cliente
        </a>
    </div>

    <div class="alert alert-success"
         th:if="${sucesso}"
         th:text="${sucesso}"></div>

    <div class="alert alert-danger"
         th:if="${erro}"
         th:text="${erro}"></div>

    <div id="erroCliente"
         class="alert alert-danger"
         role="alert"
         hidden></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Endereço</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="4" class="text-center">
                    Nenhum cliente cadastrado.
                </td>
            </tr>

            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.nome}"></td>
                <td th:text="${cliente.telefone}"></td>

                <td>
                    <span th:text="${cliente.logradouro}"></span>
                    <span th:text="${cliente.numero}"></span>
                    <span th:text="${cliente.complemento}"></span>
                    <span th:text="${cliente.bairro}"></span>
                    <span th:text="${cliente.cidade}"></span>
                    <span th:text="${cliente.estado}"></span>

                    <span th:if="${#strings.isEmpty(cliente.logradouro)}"
                          th:text="${cliente.endereco}"></span>
                </td>

                <td>
                    <div th:if="${perfilAtual == 'ATENDENTE'}">
                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                           class="btn btn-sm btn-outline-primary">
                            Editar
                        </a>

                        <button type="button"
                                class="btn btn-sm btn-outline-danger"
                                th:attr="data-id=${cliente.id}"
                                onclick="excluirCliente(this)">
                            Excluir
                        </button>
                    </div>

                    <span th:if="${perfilAtual == 'GERENTE'}">
                        Somente consulta
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function excluirCliente(botao) {
            if (!confirm('Deseja excluir este cliente?')) {
                return;
            }

            const aviso = document.getElementById('erroCliente');
            aviso.hidden = true;
            botao.disabled = true;

            try {
                await chamarApi(
                    `/api/clientes/${encodeURIComponent(botao.dataset.id)}`,
                    'DELETE'
                );

                window.location.reload();
            } catch (erro) {
                aviso.textContent = erro.message;
                aviso.hidden = false;
            } finally {
                botao.disabled = false;
            }
        }
    </script>

</div>
</body>
</html>
