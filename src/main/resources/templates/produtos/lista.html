<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <h2 class="mb-4">Produtos</h2>

    <div id="erroProduto"
         class="alert alert-danger"
         role="alert"
         hidden></div>

    <section class="card card-body mb-4"
             th:if="${perfilAtual == 'ADMIN' or perfilAtual == 'GERENTE'}">

        <h4 id="tituloFormulario">Novo produto</h4>

        <form id="formProduto">
            <input type="hidden" id="produtoId">

            <div class="mb-3">
                <label for="nomeProduto" class="form-label">Nome</label>
                <input type="text"
                       id="nomeProduto"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label for="tipoProduto" class="form-label">Tipo</label>
                <select id="tipoProduto" class="form-select" required>
                    <option value="">Selecione</option>
                    <option value="Pizza">Pizza</option>
                    <option value="Lanche">Lanche</option>
                    <option value="Bebida">Bebida</option>
                    <option value="Porção">Porção</option>
                    <option value="Adicional">Adicional</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="precoProduto" class="form-label">Preço</label>
                <input type="number"
                       id="precoProduto"
                       class="form-control"
                       min="0.01"
                       step="0.01"
                       required>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox"
                       id="ativoProduto"
                       class="form-check-input"
                       checked>
                <label for="ativoProduto" class="form-check-label">
                    Ativo
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Salvar
            </button>

            <button type="button"
                    id="limparProduto"
                    class="btn btn-outline-secondary">
                Limpar
            </button>
        </form>
    </section>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Preço</th>
                <th>Ativo</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="listaProdutos"></tbody>
        </table>
    </div>

    <script th:inline="javascript">
        (() => {
            const perfil = /*[[${perfilAtual}]]*/ '';
            const podeGerenciar = ['ADMIN', 'GERENTE'].includes(perfil);
            const formulario = document.getElementById('formProduto');
            const tabela = document.getElementById('listaProdutos');
            const aviso = document.getElementById('erroProduto');

            function mostrarErro(erro) {
                aviso.textContent = erro.message;
                aviso.hidden = false;
            }

            function limparFormulario() {
                formulario.reset();
                document.getElementById('produtoId').value = '';
                document.getElementById('tituloFormulario')
                    .textContent = 'Novo produto';
            }

            function criarBotao(texto, classe, acao) {
                const botao = document.createElement('button');
                botao.type = 'button';
                botao.className = `btn btn-sm ${classe} me-2`;
                botao.textContent = texto;

                botao.addEventListener('click', async () => {
                    aviso.hidden = true;
                    botao.disabled = true;

                    try {
                        await acao();
                    } catch (erro) {
                        mostrarErro(erro);
                    } finally {
                        botao.disabled = false;
                    }
                });

                return botao;
            }

            async function carregarProdutos() {
                const produtos = await chamarApi('/api/produtos');
                tabela.replaceChildren();

                if (produtos.length === 0) {
                    const linha = document.createElement('tr');
                    const celula = document.createElement('td');
                    celula.colSpan = 5;
                    celula.textContent = 'Nenhum produto cadastrado.';
                    linha.appendChild(celula);
                    tabela.appendChild(linha);
                    return;
                }

                for (const produto of produtos) {
                    const linha = document.createElement('tr');

                    const valores = [
                        produto.nome,
                        produto.tipo,
                        Number(produto.preco || 0).toLocaleString('pt-BR', {
                            style: 'currency',
                            currency: 'BRL'
                        }),
                        produto.ativo ? 'Sim' : 'Não'
                    ];

                    for (const valor of valores) {
                        const celula = document.createElement('td');
                        celula.textContent = valor ?? '—';
                        linha.appendChild(celula);
                    }

                    const acoes = document.createElement('td');

                    if (podeGerenciar) {
                        acoes.appendChild(criarBotao(
                            'Editar',
                            'btn-outline-primary',
                            async () => {
                                document.getElementById('produtoId')
                                    .value = produto.id;

                                document.getElementById('nomeProduto')
                                    .value = produto.nome || '';

                                document.getElementById('tipoProduto')
                                    .value = produto.tipo || '';

                                document.getElementById('precoProduto')
                                    .value = produto.preco;

                                document.getElementById('ativoProduto')
                                    .checked = produto.ativo === true;

                                document.getElementById('tituloFormulario')
                                    .textContent = 'Editar produto';

                                formulario.scrollIntoView({
                                    behavior: 'smooth'
                                });
                            }
                        ));

                        acoes.appendChild(criarBotao(
                            'Excluir',
                            'btn-outline-danger',
                            async () => {
                                if (!confirm('Deseja excluir este produto?')) {
                                    return;
                                }

                                await chamarApi(
                                    `/api/produtos/${encodeURIComponent(produto.id)}`,
                                    'DELETE'
                                );

                                if (document.getElementById('produtoId').value
                                        === produto.id) {
                                    limparFormulario();
                                }

                                await carregarProdutos();
                            }
                        ));
                    } else {
                        acoes.textContent = 'Somente consulta';
                    }

                    linha.appendChild(acoes);
                    tabela.appendChild(linha);
                }
            }

            if (formulario) {
                document.getElementById('limparProduto')
                    .addEventListener('click', limparFormulario);

                formulario.addEventListener('submit', async event => {
                    event.preventDefault();
                    aviso.hidden = true;

                    const botao = formulario.querySelector('[type="submit"]');
                    botao.disabled = true;

                    try {
                        const id = document.getElementById('produtoId').value;

                        const produto = {
                            nome: document.getElementById('nomeProduto')
                                .value.trim(),
                            tipo: document.getElementById('tipoProduto').value,
                            preco: Number(
                                document.getElementById('precoProduto').value
                            ),
                            ativo: document.getElementById('ativoProduto').checked
                        };

                        if (!produto.nome || !produto.tipo
                                || !Number.isFinite(produto.preco)
                                || produto.preco <= 0) {
                            throw new Error(
                                'Preencha nome, tipo e um preço maior que zero.'
                            );
                        }

                        await chamarApi(
                            id
                                ? `/api/produtos/${encodeURIComponent(id)}`
                                : '/api/produtos',
                            id ? 'PUT' : 'POST',
                            produto
                        );

                        limparFormulario();
                        await carregarProdutos();
                    } catch (erro) {
                        mostrarErro(erro);
                    } finally {
                        botao.disabled = false;
                    }
                });
            }

            carregarProdutos().catch(mostrarErro);
        })();
    </script>

</div>
</body>
</html>
