<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">
                <div class="sidebar-header">
                    <h4 class="sidebar-brand mb-0">Pediu Patrão</h4>
                    <button type="button" id="recolherMenu" class="sidebar-toggle" aria-label="Recolher menu" aria-expanded="true" aria-controls="sidebar">
                        <i class="bi bi-chevron-left" aria-hidden="true"></i>
                    </button>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item"
                        th:if="${perfilAtual == 'GERENTE' or perfilAtual == 'ATENDENTE'}">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item"
    th:if="${perfilAtual == 'ADMIN' or perfilAtual == 'GERENTE'}">
    <a class="nav-link" th:href="@{/auditorias}">
        <i class="bi bi-clock-history"></i>
        <span class="d-none d-md-inline">&nbsp;Auditoria</span>
    </a>
</li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            <i class="bi bi-gear"></i><span class="d-none d-md-inline">&nbsp;Configurações</span>
                            <span class="float-end">&#9662;</span> <!-- Setinha -->
                        </a>
                        <ul class="nav flex-column submenu">
                            <li class="nav-item">
                                <span class="nav-link disabled text-white-50" aria-disabled="true">
                                    <i class="bi bi-person-walking"></i>
                                    <span class="d-none d-md-inline">&nbsp;Funcionários</span>
                                    <small class="d-block">Em breve</small>
                                </span>
                            </li>
                            <li class="nav-item">
                                <span class="nav-link disabled text-white-50" aria-disabled="true">
                                    <i class="bi bi-bicycle"></i>
                                    <span class="d-none d-md-inline">&nbsp;Entregadores</span>
                                    <small class="d-block">Em breve</small>
                                </span>
                            </li>
                            <li class="nav-item">
                                <span class="nav-link disabled text-white-50" aria-disabled="true">
                                    <i class="bi bi-clock"></i>
                                    <span class="d-none d-md-inline">&nbsp;Horário de Funcionamento</span>
                                    <small class="d-block">Em breve</small>
                                </span>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/produtos}">
                                    <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                                </a>
                            </li>
                            <li class="nav-item" th:if="${perfilAtual == 'ADMIN'}">
                                <a class="nav-link" th:href="@{/usuarios}">
                                    <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="sidebar-logout">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="nav-link" title="Sair">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                        <span>Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
